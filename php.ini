; Local runtime for the legacy 17camera PHP site
short_open_tag = On
asp_tags = Off
output_buffering = On
implicit_flush = Off
variables_order = "EGPCS"
request_order = "GP"
default_charset = "UTF-8"
date.timezone = "Asia/Shanghai"

display_errors = On
display_startup_errors = On
error_reporting = E_ALL & ~E_NOTICE & ~E_WARNING & ~E_DEPRECATED & ~E_STRICT
log_errors = On
error_log = "/tmp/yiqi_php_error.log"

memory_limit = 256M
max_execution_time = 120
post_max_size = 32M
upload_max_filesize = 32M
upload_tmp_dir = "/tmp"

session.save_path = "/tmp"
session.gc_maxlifetime = 3600

mysqli.default_host = "127.0.0.1"
mysqli.default_port = 3307
mysqli.default_user = "17pub"
mysqli.default_pw = "17171717"
mysqli.default_socket = "/tmp/mysql.sock"

auto_prepend_file = "/Users/mac/自媒体创作/逸憩_网站/deploy_local/compat.php"
